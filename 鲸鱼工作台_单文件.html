<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2d5a3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="鲸鱼工作台">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%232d5a3d'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='white'%3E🐳%3C/text%3E%3C/svg%3E">
  <title>鲸鱼工作台</title>
  <style>
/* ============================================
   鲸鱼工作台 - 核心样式系统
   森林绿 + 米白 | 简约微微可爱 | 丰富微动效
   ============================================ */

/* === 设计变量 === */
:root {
  /* 主色系 - 森林绿 */
  --green-900: #1b4332;
  --green-800: #1a3a28;
  --green-700: #2d6a4f;
  --green-600: #40916c;
  --green-500: #52b788;
  --green-400: #74c69d;
  --green-300: #b7e4c7;
  --green-200: #d8f3dc;
  --green-100: #eaf5ed;
  --green-50: #f0f7f2;

  /* 白色系 */
  --white: #ffffff;
  --white-soft: #faf8f3;
  --white-muted: rgba(255, 255, 255, 0.1);

  /* 背景与中性色 - 暖米白主基调 */
  --bg: #f2f0eb;
  --bg-card: #faf6ef;
  --bg-card-alt: #f5f0e8;
  --bg-overlay: rgba(0, 0, 0, 0.4);

  /* 文字 */
  --text-primary: #1b4332;
  --text-secondary: #40916c;
  --text-tertiary: #74c69d;
  --text-on-green: #ffffff;
  --text-on-green-soft: #eaf5ed;

  /* 功能色 */
  --gold: #e9b44c;
  --gold-light: #f4d77e;
  --orange: #e07a5f;
  --red: #c84b31;
  --blue: #4a8eb5;

  /* 阴影 */
  --shadow-sm: 0 1px 3px rgba(45, 90, 61, 0.08);
  --shadow-md: 0 2px 8px rgba(45, 90, 61, 0.1);
  --shadow-lg: 0 4px 16px rgba(45, 90, 61, 0.12);
  --shadow-xl: 0 8px 32px rgba(45, 90, 61, 0.16);
  --shadow-green: 0 2px 12px rgba(45, 90, 61, 0.2);

  /* 圆角 */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-full: 9999px;

  /* 间距 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* 字号 */
  --fs-xs: 11px;
  --fs-sm: 13px;
  --fs-base: 15px;
  --fs-md: 17px;
  --fs-lg: 20px;
  --fs-xl: 24px;
  --fs-2xl: 30px;
  --fs-3xl: 36px;

  /* 过渡 */
  --t-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --t-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --t-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  --t-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

  /* 安全区 */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* === Reset === */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial,
    sans-serif;
  font-size: var(--fs-base);
  color: var(--text-primary);
  background: var(--bg);
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font-family: inherit;
  font-size: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

ul, ol { list-style: none; }

/* === 滚动条 === */
::-webkit-scrollbar { width: 0; height: 0; }

/* === App 容器 === */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(72px + var(--safe-bottom));
  position: relative;
}

/* === 页面 === */
.page {
  display: none;
  padding: calc(var(--sp-4) + var(--safe-top)) var(--sp-4) var(--sp-6);
  animation: pageIn var(--t-base);
}
.page.active { display: block; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* === 底部导航 === */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #0f2e1a;
  border-top: 1px solid rgba(64, 145, 108, 0.2);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: var(--sp-2) 0 calc(var(--sp-2) + var(--safe-bottom));
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.2);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--sp-2) 0;
  color: #74c69d;
  transition: color var(--t-fast);
  position: relative;
}

.nav-item.active {
  color: #52b788;
}

.nav-item.active::before {
  content: "";
  position: absolute;
  top: 0;
  width: 24px;
  height: 3px;
  background: #52b788;
  border-radius: var(--r-full);
  animation: navIndicator var(--t-bounce);
}

@keyframes navIndicator {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

.nav-icon {
  width: 24px;
  height: 24px;
  object-fit: contain;
  line-height: 1;
  transition: transform var(--t-bounce);
  filter: opacity(0.5);
}

.nav-item.active .nav-icon {
  filter: opacity(1);
  transform: scale(1.15) translateY(-2px);
}

.nav-label {
  font-size: var(--fs-xs);
  font-weight: 500;
}

/* === 卡片 === */
.card {
  background: var(--bg-card);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--t-base), transform var(--t-base);
}

.card:active {
  transform: scale(0.98);
}

.card + .card {
  margin-top: var(--sp-3);
}

/* === 按钮 === */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--r-md);
  font-size: var(--fs-base);
  font-weight: 600;
  transition: all var(--t-fast);
  white-space: nowrap;
  user-select: none;
}

.btn:active {
  transform: scale(0.95);
}

.btn-primary {
  background: var(--green-700);
  color: var(--text-on-green);
  box-shadow: var(--shadow-green);
}

.btn-primary:active {
  background: var(--green-800);
}

.btn-secondary {
  background: var(--green-50);
  color: var(--green-700);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
}

.btn-danger {
  background: rgba(200, 75, 49, 0.1);
  color: var(--red);
}

.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--green-900);
  box-shadow: 0 2px 12px rgba(233, 180, 76, 0.4);
}

.btn-block {
  width: 100%;
}

.btn-sm {
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-sm);
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* === 等级条 === */
.level-bar {
  background: linear-gradient(135deg, var(--green-700), var(--green-600));
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  color: var(--text-on-green);
  box-shadow: var(--shadow-green);
  position: relative;
  overflow: hidden;
}

.level-bar::after {
  content: "";
  position: absolute;
  top: -50%;
  right: -20%;
  width: 60%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.level-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-3);
}

.level-badge {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.level-num {
  font-size: var(--fs-xl);
  font-weight: 800;
  letter-spacing: -0.5px;
}

.level-label {
  font-size: var(--fs-sm);
  opacity: 0.85;
}

.points-display {
  text-align: right;
}

.points-num {
  font-size: var(--fs-xl);
  font-weight: 800;
  letter-spacing: -0.5px;
  transition: transform var(--t-bounce);
}

.points-num.bump {
  animation: bump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes bump {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); color: var(--gold-light); }
  100% { transform: scale(1); }
}

.points-label {
  font-size: var(--fs-xs);
  opacity: 0.7;
}

/* 经验进度条 */
.xp-bar-wrap {
  background: rgba(255, 255, 255, 0.2);
  border-radius: var(--r-full);
  height: 8px;
  overflow: hidden;
  position: relative;
}

.xp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: var(--r-full);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.xp-bar-fill::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.xp-text {
  font-size: var(--fs-xs);
  opacity: 0.75;
  margin-top: var(--sp-1);
  text-align: right;
}

/* === 连续打卡 === */
.streak-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  background: rgba(255, 255, 255, 0.1);
  border-radius: var(--r-md);
  width: fit-content;
}

.streak-icon {
  width: 20px;
  height: 20px;
  object-fit: contain;
  filter: brightness(0) invert(1);
  animation: bellRing 1.5s ease-in-out infinite alternate;
}

@keyframes bellRing {
  from { transform: rotate(-8deg); }
  to { transform: rotate(8deg); }
}

.streak-text {
  font-size: var(--fs-sm);
  font-weight: 600;
}

/* === Tab 切换 === */
.tab-switch {
  display: flex;
  background: rgba(26, 58, 40, 0.6);
  border-radius: var(--r-md);
  padding: 3px;
  margin: var(--sp-4) 0;
  gap: 3px;
}

.tab-switch button {
  flex: 1;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: #52b788;
  background: transparent;
  transition: all var(--t-fast);
}

.tab-switch button.active {
  background: #40916c;
  color: white;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  animation: tabSlide var(--t-bounce);
}

@keyframes tabSlide {
  from { transform: scale(0.95); opacity: 0.6; }
  to { transform: scale(1); opacity: 1; }
}

/* === 任务列表 === */
.task-list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-3);
}

.task-list-title {
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.completion-rate {
  font-size: var(--fs-sm);
  color: var(--text-tertiary);
  font-weight: 600;
}

.completion-rate .rate-num {
  color: var(--green-600);
  font-weight: 700;
}

.task-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: #faf6ef;
  border: 1px solid #d8f3dc;
  border-radius: var(--r-md);
  box-shadow: 0 2px 8px rgba(45, 90, 61, 0.08);
  transition: all var(--t-base);
  position: relative;
  overflow: hidden;
}

.task-item + .task-item {
  margin-top: var(--sp-2);
}

.task-item:active {
  transform: scale(0.98);
}

.task-item.completed {
  opacity: 0.55;
}

.task-item.completed .task-name {
  text-decoration: line-through;
  text-decoration-color: var(--green-500);
  text-decoration-thickness: 2px;
}

.task-item.partial .task-name {
  color: var(--text-secondary);
}

/* 完成度指示器 */
.task-progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green-400), var(--green-500));
  border-radius: 0 var(--r-full) var(--r-full) 0;
  transition: width var(--t-slow);
}

/* 勾选圆圈 */
.task-check {
  width: 26px;
  height: 26px;
  min-width: 26px;
  border-radius: var(--r-full);
  border: 2.5px solid var(--green-300);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--t-bounce);
  position: relative;
}

.task-check:active {
  transform: scale(0.85);
}

.task-item.completed .task-check {
  background: var(--green-600);
  border-color: var(--green-600);
}

.task-item.partial .task-check {
  border-color: var(--green-500);
  background: var(--green-100);
}

.task-check svg {
  width: 16px;
  height: 16px;
  color: white;
  opacity: 0;
  transform: scale(0.5);
  transition: all var(--t-bounce);
}

.task-item.completed .task-check svg {
  opacity: 1;
  transform: scale(1);
}

.task-content {
  flex: 1;
  min-width: 0;
}

.task-name {
  font-size: var(--fs-base);
  font-weight: 600;
  color: #1b4332;
  transition: all var(--t-base);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-meta {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: 2px;
}

.task-tag {
  font-size: var(--fs-xs);
  padding: 1px 6px;
  border-radius: var(--r-sm);
  background: rgba(64, 145, 108, 0.2);
  color: #74c69d;
  font-weight: 500;
}

.task-points {
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--gold);
  white-space: nowrap;
}

.task-points.earned {
  color: var(--green-500);
}

/* === 每日挑战 === */
.daily-challenge {
  background: #40916c;
  border: none;
  border-radius: var(--r-lg);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin: var(--sp-4) 0;
  transition: all var(--t-base);
  color: white;
}

.daily-challenge.done {
  background: #2d6a4f;
  opacity: 0.7;
}

.challenge-icon {
  width: 28px;
  height: 28px;
  object-fit: contain;
  flex-shrink: 0;
  animation: wiggle 2s ease-in-out infinite;
}

.challenge-text {
  flex: 1;
}

.challenge-title {
  font-size: var(--fs-xs);
  color: rgba(255,255,255,0.7);
  font-weight: 600;
}

.challenge-desc {
  font-size: var(--fs-sm);
  color: #ffffff;
  font-weight: 600;
  margin-top: 2px;
}

.challenge-reward {
  font-size: var(--fs-sm);
  font-weight: 700;
  color: #1a3a28;
  background: rgba(255,255,255,0.9);
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--r-sm);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.daily-challenge.done .challenge-reward {
  color: #74c69d;
  background: rgba(255,255,255,0.15);
}

.daily-challenge.done .challenge-desc {
  text-decoration: line-through;
  text-decoration-color: rgba(255,255,255,0.3);
}

.daily-challenge.done {
  background: linear-gradient(135deg, var(--green-100), var(--green-50));
  border-color: var(--green-300);
}

.challenge-icon {
  width: 28px;
  height: 28px;
  object-fit: contain;
  flex-shrink: 0;
  animation: wiggle 2s ease-in-out infinite;
}

@keyframes wiggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-8deg); }
  75% { transform: rotate(8deg); }
}

.challenge-text {
  flex: 1;
}

.challenge-title {
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  font-weight: 600;
}

.challenge-desc {
  font-size: var(--fs-sm);
  color: var(--text-primary);
  font-weight: 600;
  margin-top: 2px;
}

.challenge-reward {
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--gold);
  background: var(--bg-card);
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-sm);
}

.daily-challenge.done .challenge-reward {
  color: var(--green-600);
  background: var(--bg-card);
}

.daily-challenge.done .challenge-desc {
  text-decoration: line-through;
  text-decoration-color: var(--green-400);
}

/* === 添加按钮 === */
.add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  width: 100%;
  padding: var(--sp-3);
  border: 2px dashed rgba(64, 145, 108, 0.5);
  border-radius: var(--r-md);
  color: #74c69d;
  font-size: var(--fs-base);
  font-weight: 600;
  transition: all var(--t-fast);
  background: transparent;
  margin-top: var(--sp-3);
}

.add-btn:active {
  background: rgba(64, 145, 108, 0.15);
  border-color: #52b788;
  transform: scale(0.98);
}

/* === 弹窗/模态框 === */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-base);
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: #faf6ef;
  width: 100%;
  max-width: 480px;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: var(--sp-5) var(--sp-4) calc(var(--sp-6) + var(--safe-bottom));
  transform: translateY(100%);
  transition: transform var(--t-slow);
  max-height: 85vh;
  overflow-y: auto;
}

.modal-overlay.show .modal {
  transform: translateY(0);
}

.modal-title {
  font-size: var(--fs-lg);
  font-weight: 700;
  margin-bottom: var(--sp-4);
  text-align: center;
  color: #1b4332;
}

/* === 表单 === */
.form-group {
  margin-bottom: var(--sp-4);
}

.form-label {
  display: block;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: #40916c;
  margin-bottom: var(--sp-2);
}

.form-input {
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  border: 2px solid #b7e4c7;
  border-radius: var(--r-md);
  font-size: var(--fs-base);
  background: #f5f0e8;
  transition: all var(--t-fast);
  color: #1b4332;
}

.form-input:focus {
  outline: none;
  border-color: #40916c;
  background: #faf6ef;
  box-shadow: 0 0 0 4px rgba(64, 145, 108, 0.15);
}

.form-select {
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  border: 2px solid #74c69d;
  border-radius: var(--r-md);
  font-size: var(--fs-base);
  background: #f5f0e8;

 * 数据来源：中国农历标准对照表，已交叉验证
 */

/**
 * 农历正月初一（春节）对应阳历日期表
 */
var SPRING_FESTIVAL = {
  2024: '2024-02-10', 2025: '2025-01-29', 2026: '2026-02-17',
  2027: '2027-02-06', 2028: '2028-01-26', 2029: '2029-02-13',
  2030: '2030-02-03', 2031: '2031-01-23', 2032: '2032-02-11',
  2033: '2033-01-31', 2034: '2034-02-19', 2035: '2035-02-08',
  2036: '2036-01-28', 2037: '2037-02-15', 2038: '2038-02-04',
  2039: '2039-01-24', 2040: '2040-02-12', 2041: '2041-02-01',
  2042: '2042-01-22', 2043: '2043-02-10', 2044: '2044-01-30',
  2045: '2045-02-17', 2046: '2046-02-06', 2047: '2047-01-26',
  2048: '2048-02-14', 2049: '2049-02-02', 2050: '2050-01-23'
};

/**
 * 农历五月初五（端午）对应阳历日期表
 */
var DRAGON_BOAT = {
  2024: '2024-06-10', 2025: '2025-05-31', 2026: '2026-06-19',
  2027: '2027-06-09', 2028: '2028-05-28', 2029: '2029-06-16',
  2030: '2030-06-05', 2031: '2031-06-24', 2032: '2032-06-12',
  2033: '2033-06-01', 2034: '2034-06-20', 2035: '2035-06-09',
  2036: '2036-05-30', 2037: '2037-06-18', 2038: '2038-06-07',
  2039: '2039-06-26', 2040: '2040-06-14', 2041: '2041-06-03',
  2042: '2042-06-22', 2043: '2043-06-11', 2044: '2044-05-31',
  2045: '2045-06-19', 2046: '2046-06-08', 2047: '2047-05-28',
  2048: '2048-06-15', 2049: '2049-06-04', 2050: '2050-06-23'
};

/**
 * 农历八月十五（中秋）对应阳历日期表
 */
var MID_AUTUMN = {
  2024: '2024-09-17', 2025: '2025-10-06', 2026: '2026-09-25',
  2027: '2027-09-15', 2028: '2028-10-03', 2029: '2029-09-22',
  2030: '2030-09-12', 2031: '2031-10-01', 2032: '2032-09-19',
  2033: '2033-09-08', 2034: '2034-09-27', 2035: '2035-09-16',
  2036: '2036-10-04', 2037: '2037-09-24', 2038: '2038-09-13',
  2039: '2039-10-02', 2040: '2040-09-21', 2041: '2041-09-10',
  2042: '2042-09-28', 2043: '2043-09-17', 2044: '2044-10-05',
  2045: '2045-09-25', 2046: '2046-09-15', 2047: '2047-10-04',
  2048: '2048-09-22', 2049: '2049-09-11', 2050: '2050-09-30'
};

/**
 * 农历各月天数表（用于计算非标准节日的阳历日期）
 * 格式: { 年份: [正月天数, 二月天数, ...十二月天数, 闰月天数(0=无闰月)] }
 * 这里只需要计算生日（农历三月廿八），所以用春节日期+偏移天数来推算
 */

/**
 * 获取某年农历正月初一对应的阳历日期
 */
function getSpringFestivalDate(year) {
  var str = SPRING_FESTIVAL[year];
  if (!str) return null;
  var parts = str.split('-');
  return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
}

/**
 * 农历各月天数计算
 * 使用标准农历数据表计算指定年份各月天数
 */
var LUNAR_MONTH_DATA = {
  2024: [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 0], // 无闰月
  2025: [29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 0], // 无闰月
  2026: [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 30, 29], // 闰五月(29天)
  2027: [29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 0], // 无闰月
  2028: [30, 29, 30, 29, 30, 30, 29, 30, 29, 30, 29, 30, 0], // 无闰月
  2029: [29, 30, 29, 30, 29, 30, 29, 30, 30, 29, 30, 29, 0], // 无闰月
  2030: [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30], // 闰六月(30天)
};

// 通用农历月天数计算（基于标准数据表，覆盖2024-2050）
// 格式: hex数据编码每月大小 + 闰月信息
var LUNAR_DATA = [
  // 2024: 无闰月
  { leap: 0, months: [30,29,30,29,30,29,30,29,30,29,30,29] },
  // 2025: 无闰月
  { leap: 0, months: [29,30,29,30,29,30,29,30,29,30,29,30] },
  // 2026: 闰五月
  { leap: 5, months: [30,29,30,29,30,29,30,29,30,29,30,30], leapDays: 29 },
  // 2027: 无闰月
  { leap: 0, months: [29,30,29,30,29,30,29,30,29,30,29,30] },
  // 2028: 无闰月
  { leap: 0, months: [30,29,30,29,30,30,29,30,29,30,29,30] },
  // 2029: 无闰月
  { leap: 0, months: [29,30,29,30,29,30,29,30,30,29,30,29] },
  // 2030: 闰六月
  { leap: 6, months: [30,29,30,29,30,29,30,29,30,29,30,29], leapDays: 30 },
];

/**
 * 获取农历日期对应的阳历日期
 * @param {number} year - 阳历年份
 * @param {number} lunarMonth - 农历月 (1-12)
 * @param {number} lunarDay - 农历日 (1-30)
 * @returns {Date} 阳历日期
 */
function getSolarFromLunar(year, lunarMonth, lunarDay) {
  // 先获取该年春节（正月初一）的阳历日期
  var springFestival = getSpringFestivalDate(year);
  if (!springFestival) {
    // 超出表范围，回退使用近似计算
    return approximateLunarToSolar(year, lunarMonth, lunarDay);
  }

  // 获取该年的农历月份数据
  var yearData = getYearData(year);
  if (!yearData) {
    return approximateLunarToSolar(year, lunarMonth, lunarDay);
  }

  // 从正月初一累加天数
  var offset = 0;
  for (var m = 1; m < lunarMonth; m++) {
    offset += yearData.months[m - 1];
    // 如果闰月恰好是 m，加上闰月天数
    if (yearData.leap === m) {
      offset += yearData.leapDays || 29;
    }
  }
  offset += lunarDay - 1;

  var result = new Date(springFestival);
  result.setDate(springFestival.getDate() + offset);
  return result;
}

function getYearData(year) {
  // 优先使用详细数据
  if (year >= 2024 && year <= 2030) {
    return LUNAR_DATA[year - 2024];
  }
  // 对于没有详细数据的年份，使用预计算的节日表来反推
  // 如果该年有春节数据，我们可以根据春节日期估算各月天数
  var spring = SPRING_FESTIVAL[year];
  if (!spring) return null;

  // 计算该年农历总天数（从春节到下一个春节）
  var nextSpring = SPRING_FESTIVAL[year + 1];
  if (!nextSpring) return null;

  var d1 = new Date(spring);
  var d2 = new Date(nextSpring);
  var totalDays = Math.round((d2 - d1) / 86400000);

  // 标准农历年有12或13个月
  // 12个月: 353-355天, 13个月(有闰月): 383-385天
  var hasLeap = totalDays > 380;

  // 使用默认的月大小模式（大小月交替）
  var months = [];
  for (var i = 0; i < 12; i++) {
    months.push(i % 2 === 0 ? 30 : 29);
  }
  // 调整使总天数接近
  var sum = months.reduce(function(a, b) { return a + b; }, 0);
  var diff = totalDays - sum - (hasLeap ? 29 : 0);
  // 简单调整
  if (diff > 0) {
    for (var j = 0; j < diff && j < 12; j++) {
      months[j] = months[j] === 29 ? 30 : months[j];
    }
  }

  return { leap: 0, months: months };
}

function approximateLunarToSolar(year, lunarMonth, lunarDay) {
  // 回退方案：使用春节日期 + 标准大小月推算
  var spring = getSpringFestivalDate(year);
  if (!spring) {
    // 完全超出范围，返回一个近似值
    // 农历比阳历约晚1-2个月
    return new Date(year, lunarMonth - 1 + 1, lunarDay);
  }
  var offset = 0;
  for (var m = 1; m < lunarMonth; m++) {
    offset += m % 2 === 1 ? 30 : 29;
  }
  offset += lunarDay - 1;
  var result = new Date(spring);
  result.setDate(spring.getDate() + offset);
  return result;
}

// 导出
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { getSolarFromLunar, SPRING_FESTIVAL, DRAGON_BOAT, MID_AUTUMN };
}
if (typeof window !== 'undefined') {
  window.getSolarFromLunar = getSolarFromLunar;
  window.SPRING_FESTIVAL = SPRING_FESTIVAL;
  window.DRAGON_BOAT = DRAGON_BOAT;
  window.MID_AUTUMN = MID_AUTUMN;
}

  <script>
/* ============================================
   鲸鱼工作台 - 主应用逻辑
   ============================================ */

/* ===== 数据层 ===== */
var STORE_KEY = 'whale_workbench_data';

function getDefaultData() {
  return {
    version: 1,
    // 积分双体系
    totalXP: 0,          // 累计经验值（只增不减，定等级）
    availablePoints: 0,  // 可用余额（可消费）
    // 等级
    level: 1,
    // 连续打卡
    streak: 0,           // 当前连续天数
    lastCheckIn: null,   // 上次打卡日期 (YYYY-MM-DD)
    // 任务
    tasks: [],           // 所有任务定义 {id, name, points, period, tag, createdAt}
    taskRecords: {},     // 任务完成记录 {date: {taskId: {progress, points, time}}}
    // 每周每月任务的周期记录
    weeklyRecords: {},   // {weekKey: {taskId: {progress, points}}}
    monthlyRecords: {},  // {monthKey: {taskId: {progress, points}}}
    // 奖励
    rewards: [],         // {id, name, cost, icon}
    exchangeRecords: [], // {name, cost, icon, time}
    // 抽奖
    lotteryChances: 0,   // 剩余抽奖次数
    // 道具
    doubleCards: 0,      // 双倍积分卡数量
    shields: 0,          // 断签护盾数量
    doubleCardActive: null, // 双倍卡激活时间戳 (ms)，null=未激活
    // 徽章
    badges: [],          // {id, name, icon, unlockedAt, count}
    // 每日挑战
    dailyChallenge: null, // {date, type, desc, reward, done}
    // 每日积分历史（用于统计图表）
    pointsHistory: {},   // {date: earnedPoints}
    // 上次访问时间（用于判断断签）
    lastVisit: null,
    // 生日设置
    birthdayLunar: { month: 3, day: 28 } // 农历三月廿八
  };
}

var data = loadData();

function loadData() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return getDefaultData();
    var parsed = JSON.parse(raw);
    // 合并默认值，防止字段缺失
    var defaults = getDefaultData();
    return Object.assign(defaults, parsed);
  } catch(e) {
    return getDefaultData();
  }
}

function saveData() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch(e) {
    showToast('数据保存失败');
  }
}

/* ===== 日期工具 ===== */
function getTodayStr() {
  return formatDate(getCurrentDay());
}

function getCurrentDay() {
  // 每日凌晨5点刷新，5点前算前一天
  var now = new Date();
  var hour = now.getHours();
  if (hour < 5) {
    now.setDate(now.getDate() - 1);
  }
  return now;
}

function formatDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function getWeekKey(d) {
  // 周一为一周开始
  var date = d || getCurrentDay();
  var day = date.getDay();
  var diff = day === 0 ? -6 : 1 - day; // 周一为0
  var monday = new Date(date);
  monday.setDate(date.getDate() + diff);
  return formatDate(monday);
}

function getMonthKey(d) {
  var date = d || getCurrentDay();
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
}

function dateDiffDays(d1, d2) {
  var t1 = new Date(d1).getTime();
  var t2 = new Date(d2).getTime();
  return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
}

/* ===== 法定节假日 ===== */
function getHolidays(year) {
  var holidays = {};
  // 元旦
  holidays[year + '-01-01'] = '元旦';
  // 清明（约4月4-6日）
  holidays[year + '-04-04'] = '清明节';
  holidays[year + '-04-05'] = '清明节';
  holidays[year + '-04-06'] = '清明节';
  // 劳动节
  holidays[year + '-05-01'] = '劳动节';
  holidays[year + '-05-02'] = '劳动节';
  holidays[year + '-05-03'] = '劳动节';
  // 端午（使用预计算表，回退用农历换算）
  var dbStr = (typeof DRAGON_BOAT !== 'undefined' && DRAGON_BOAT[year]) || formatDate(getSolarFromLunar(year, 5, 5));
  holidays[dbStr] = '端午节';
  // 中秋（使用预计算表，回退用农历换算）
  var maStr = (typeof MID_AUTUMN !== 'undefined' && MID_AUTUMN[year]) || formatDate(getSolarFromLunar(year, 8, 15));
  holidays[maStr] = '中秋节';
  // 国庆
  holidays[year + '-10-01'] = '国庆节';
  holidays[year + '-10-02'] = '国庆节';
  holidays[year + '-10-03'] = '国庆节';
  // 春节（使用预计算表，回退用农历换算）
  var sfStr = (typeof SPRING_FESTIVAL !== 'undefined' && SPRING_FESTIVAL[year]) || formatDate(getSolarFromLunar(year, 1, 1));
  var sfParts = sfStr.split('-');
  var sfDate = new Date(parseInt(sfParts[0]), parseInt(sfParts[1]) - 1, parseInt(sfParts[2]));
  for (var i = 0; i < 7; i++) {
    var d = new Date(sfDate);
    d.setDate(sfDate.getDate() + i);
    holidays[formatDate(d)] = '春节';
  }
  return holidays;
}

function getHolidayName(dateStr) {
  var parts = dateStr.split('-');
  var year = parseInt(parts[0]);
  var holidays = getHolidays(year);
  if (holidays[dateStr]) return holidays[dateStr];
  // 检查相邻年份（跨年情况）
  if (parts[1] === '01' || parts[1] === '12') {
    var altYear = parts[1] === '01' ? year - 1 : year + 1;
    var altHolidays = getHolidays(altYear);
    if (altHolidays[dateStr]) return altHolidays[dateStr];
  }
  return null;
}

/* ===== 生日换算 ===== */
function getBirthdayThisYear() {
  var year = new Date().getFullYear();
  // 农历三月廿八
  var birthday = getSolarFromLunar(year, 3, 28);
  return formatDate(birthday);
}

function isBirthday(dateStr) {
  return dateStr === getBirthdayThisYear();
}

/* ===== 倍率系统 ===== */
function getStreakMultiplier() {
  // 连续打卡第7天循环倍率
  if (data.streak < 7) return 1;
  // 检查今天是否是第7天的倍数
  if (data.streak % 7 === 0) {
    var weekNum = data.streak / 7;
    // 奇数周 ×1.2，偶数周 ×1.5
    return weekNum % 2 === 1 ? 1.2 : 1.5;
  }
  return 1;
}

function getSpecialDayMultiplier() {
  var today = getTodayStr();
  if (isBirthday(today)) return 3;
  if (getHolidayName(today)) return 3;
  return 1;
}

function getDoubleCardMultiplier() {
  if (data.doubleCardActive) {
    var elapsed = Date.now() - data.doubleCardActive;
    if (elapsed < 24 * 60 * 60 * 1000) {
      return 2;
    } else {
      // 过期了
      data.doubleCardActive = null;
      saveData();
    }
  }
  return 1;
}

function getTotalMultiplier() {
  // 所有倍率相乘
  return getStreakMultiplier() * getSpecialDayMultiplier() * getDoubleCardMultiplier();
}

function getActiveMultipliers() {
  var multipliers = [];
  var sm = getStreakMultiplier();
  if (sm > 1) {
    var weekNum = data.streak / 7;
    multipliers.push({
      name: '连续打卡第' + data.streak + '天',
      rate: sm,
      detail: '第' + weekNum + '周' + (weekNum % 2 === 1 ? '（×1.2）' : '（×1.5）')
    });
  }
  var sdm = getSpecialDayMultiplier();
  if (sdm > 1) {
    var today = getTodayStr();
    if (isBirthday(today)) {
      multipliers.push({ name: '生日快乐', rate: sdm, detail: '生日三倍' });
    } else {
      multipliers.push({ name: getHolidayName(today), rate: sdm, detail: '节日三倍' });
    }
  }
  var dcm = getDoubleCardMultiplier();
  if (dcm > 1) {
    multipliers.push({ name: '双倍积分卡', rate: dcm, detail: '24小时有效' });
  }
  return multipliers;
}

/* ===== 等级系统 ===== */
function getLevelInfo(level) {
  // 计算达到某等级所需的累计XP
  // 1-10级: 100/级
  // 10-20级: 200/级
  // 20-30级: 300/级 ...
  if (level <= 1) return 0;
  var total = 0;
  for (var i = 1; i < level; i++) {
    total += getXpForLevel(i);
  }
  return total;
}

function getXpForLevel(level) {
  // 从 level 升到 level+1 所需XP
  var tier = Math.floor((level - 1) / 10); // 0, 1, 2, ...
  return (tier + 1) * 100;
}

function getLevelFromXP(xp) {
  var level = 1;
  var remaining = xp;
  while (remaining >= getXpForLevel(level)) {
    remaining -= getXpForLevel(level);
    level++;
  }
  return { level: level, currentXp: remaining, needXp: getXpForLevel(level) };
}

function getLotteryChancesForLevel(level) {
  // 每级抽奖次数 = 十位 + 1
  var tier = Math.floor((level - 1) / 10);
  var base = tier + 1;
  // 整十级翻倍
  if (level % 10 === 0) base *= 2;
  return base;
}

function getShieldForLevel(level) {
  // 整十级获得护盾
  return level % 10 === 0;
}

/* ===== 连续打卡 ===== */
function checkStreak() {
  var today = getTodayStr();
  if (data.lastCheckIn === today) return; // 今天已经打卡过

  if (data.lastCheckIn) {
    var diff = dateDiffDays(data.lastCheckIn, today);
    if (diff > 1) {
      // 断签了
      if (data.shields > 0) {
        // 使用护盾
        data.shields--;
        showToast('🛡️ 已自动使用护盾，保护连续记录！');
      } else {
        // 连续记录清零
        data.streak = 0;
      }
      saveData();
    }
  }
}

function onCheckIn() {
  var today = getTodayStr();
  if (data.lastCheckIn !== today) {
    data.streak++;
    data.lastCheckIn = today;
    // 检查7天循环奖励
    if (data.streak % 7 === 0) {
      // 额外+10积分
      data.availablePoints += 10;
      data.totalXP += 10;
      saveData();
      showToast('🔥 连续打卡' + data.streak + '天！额外+10积分');
    }
    // 检查里程碑奖励
    checkStreakMilestones();
    saveData();
  }
}

function checkStreakMilestones() {
  // 每30天: +50积分 + 双倍卡 + 徽章
  if (data.streak > 0 && data.streak % 30 === 0) {
    data.availablePoints += 50;
    data.totalXP += 50;
    data.doubleCards++;
    unlockBadge('streak_' + data.streak, '连续打卡' + data.streak + '天', '<img src="./assets/icons/badge-star.png" class="badge-icon-img" alt="badge">');
    showToast('🏆 连续打卡' + data.streak + '天！+50积分 + 双倍卡 + 徽章');
  }
  // 每100天: +100积分
  if (data.streak > 0 && data.streak % 100 === 0) {
    data.availablePoints += 100;
    data.totalXP += 100;
    showToast('🎉 连续打卡' + data.streak + '天！额外+100积分');
  }
  // 每365天: +365积分 + 徽章
  if (data.streak > 0 && data.streak % 365 === 0) {
    data.availablePoints += 365;
    data.totalXP += 365;
    unlockBadge('streak_' + data.streak, '连续打卡' + data.streak + '天', '<img src="./assets/icons/whale-star.png" class="badge-icon-img" alt="badge">');
    showToast('🎉🎉 连续打卡' + data.streak + '天！+365积分 + 专属徽章');
  }
}

function unlockBadge(id, name, icon) {
  var existing = data.badges.find(function(b) { return b.id === id; });
  if (existing) {
    existing.count++;
    existing.unlockedAt = getTodayStr();
  } else {
    // 尝试从预定义中找
    var def = BADGE_DEFS.find(function(b) { return b.id === id; });
    data.badges.push({
      id: id,
      name: name || (def ? def.name : id),
      icon: icon || (def ? def.icon : '<img src="./assets/icons/badge-star.png" class="badge-icon-img" alt="badge">'),
      unlockedAt: getTodayStr(),
      count: 1
    });
  }
  saveData();
  // 显示解锁弹窗
  var b = data.badges.find(function(b) { return b.id === id; });
  showBadgeUnlock(b.icon, b.name);
}

/* ===== 每日挑战 ===== */
var CHALLENGE_TYPES = [
  { type: 'complete_3', desc: '今天完成3个任务', reward: 10 },
  { type: 'complete_5', desc: '今天完成5个任务', reward: 15 },
  { type: 'fitness', desc: '完成一个健身类任务', reward: 8 },
  { type: 'study', desc: '完成一个学习类任务', reward: 8 },
  { type: 'work', desc: '完成一个工作类任务', reward: 8 },
  { type: 'clear_all', desc: '清空今日所有任务', reward: 15 },
  { type: 'monthly', desc: '完成一个每月任务', reward: 12 },
  { type: 'points_20', desc: '今天获得20积分', reward: 10 },
  { type: 'points_30', desc: '今天获得30积分', reward: 12 }
];

function generateDailyChallenge() {
  var today = getTodayStr();
  if (data.dailyChallenge && data.dailyChallenge.date === today) return;

  var idx = Math.floor(Math.random() * CHALLENGE_TYPES.length);
  var challenge = CHALLENGE_TYPES[idx];
  data.dailyChallenge = {
    date: today,
    type: challenge.type,
    desc: challenge.desc,
    reward: challenge.reward,
    done: false
  };
  saveData();
}

function checkDailyChallenge() {
  if (!data.dailyChallenge || data.dailyChallenge.done) return;
  var today = getTodayStr();
  if (data.dailyChallenge.date !== today) return;

  var todayRecords = data.taskRecords[today] || {};
  var completedTasks = Object.keys(todayRecords).filter(function(tid) {
    return todayRecords[tid].progress > 0;
  });
  var challenge = data.dailyChallenge;

  switch(challenge.type) {
    case 'complete_3':
      if (completedTasks.length >= 3) completeDailyChallenge();
      break;
    case 'complete_5':
      if (completedTasks.length >= 5) completeDailyChallenge();
      break;
    case 'fitness':
      if (completedTasks.some(function(tid) {
        var task = data.tasks.find(function(t) { return t.id === tid; });
        return task && task.tag === '健身';
      })) completeDailyChallenge();
      break;
    case 'study':
      if (completedTasks.some(function(tid) {
        var task = data.tasks.find(function(t) { return t.id === tid; });
        return task && task.tag === '学习';
      })) completeDailyChallenge();
      break;
    case 'work':
      if (completedTasks.some(function(tid) {
        var task = data.tasks.find(function(t) { return t.id === tid; });
        return task && task.tag === '工作';
      })) completeDailyChallenge();
      break;
    case 'clear_all':
      var dailyTasks = data.tasks.filter(function(t) { return t.period === 'daily'; });
      if (dailyTasks.length > 0 && dailyTasks.every(function(t) {
        return todayRecords[t.id] && todayRecords[t.id].progress > 0;
      })) completeDailyChallenge();
      break;
    case 'monthly':
      var monthKey = getMonthKey();
      var monthlyRecs = data.monthlyRecords[monthKey] || {};
      if (Object.keys(monthlyRecs).some(function(tid) {
        return monthlyRecs[tid].progress > 0;
      })) completeDailyChallenge();
      break;
    case 'points_20':
      var earnedToday = data.pointsHistory[today] || 0;
      if (earnedToday >= 20) completeDailyChallenge();
      break;
    case 'points_30':
      var earnedToday2 = data.pointsHistory[today] || 0;
      if (earnedToday2 >= 30) completeDailyChallenge();
      break;
  }
}

function completeDailyChallenge() {
  if (!data.dailyChallenge || data.dailyChallenge.done) return;
  data.dailyChallenge.done = true;
  var reward = data.dailyChallenge.reward;
  var multiplier = getTotalMultiplier();
  var actualReward = Math.round(reward * multiplier);
  data.availablePoints += actualReward;
  data.totalXP += actualReward;
  // 记录今日积分
  var today = getTodayStr();
  data.pointsHistory[today] = (data.pointsHistory[today] || 0) + actualReward;
  saveData();
  showToast('🎯 挑战完成！+' + actualReward + '积分');
  checkLevelUp();
  checkAutoBadges();
}

/* ===== 积分计算 ===== */
function awardPoints(basePoints, taskId) {
  var multiplier = getTotalMultiplier();
  var actualPoints = Math.round(basePoints * multiplier);
  data.availablePoints += actualPoints;
  data.totalXP += actualPoints;
  // 记录今日积分
  var today = getTodayStr();
  data.pointsHistory[today] = (data.pointsHistory[today] || 0) + actualPoints;
  saveData();

  // 飘字动画
  showFloatPoints('+' + actualPoints);

  // 积分数字跳动
  var pointsEl = document.getElementById('points-num');
  if (pointsEl) {
    pointsEl.classList.remove('bump');
    void pointsEl.offsetWidth;
    pointsEl.classList.add('bump');
  }

  // 检查每日挑战
  checkDailyChallenge();

  // 检查升级和徽章
  checkLevelUp();
  checkAutoBadges();

  return actualPoints;
}

/* ===== 等级升级检查 ===== */
function checkLevelUp() {
  var oldLevel = data.level;
  var levelInfo = getLevelFromXP(data.totalXP);
  if (levelInfo.level > oldLevel) {
    // 可能连升多级
    for (var lv = oldLevel + 1; lv <= levelInfo.level; lv++) {
      data.level = lv;
      // 发放升级奖励
      var chances = getLotteryChancesForLevel(lv);
      data.lotteryChances += chances;
      var shield = getShieldForLevel(lv);
      if (shield) data.shields++;

      // 显示升级弹窗
      var rewardText = '获得 ' + chances + ' 次抽奖机会';
      if (shield) rewardText += ' + 断签护盾×1';
      showLevelUp(lv, rewardText);
    }
    saveData();
    checkAutoBadges();
  }
}

/* ===== 任务完成 ===== */
function completeTask(taskId, progress) {
  var task = data.tasks.find(function(t) { return t.id === taskId; });
  if (!task) return;

  var today = getTodayStr();
  var recordKey, records;

  if (task.period === 'daily') {
    recordKey = today;
    records = data.taskRecords[today] || {};
  } else if (task.period === 'weekly') {
    recordKey = getWeekKey();
    records = data.weeklyRecords[recordKey] || {};
  } else {
    recordKey = getMonthKey();
    records = data.monthlyRecords[recordKey] || {};
  }

  var existing = records[taskId];
  var oldProgress = existing ? existing.progress : 0;
  var newProgress = progress;

  // 如果进度增加
  if (newProgress > oldProgress) {
    var progressDiff = newProgress - oldProgress;
    var basePoints = task.points * progressDiff / 100;
    var actualPoints = awardPoints(basePoints, taskId);

    records[taskId] = {
      progress: newProgress,
      points: (existing ? existing.points : 0) + actualPoints,
      time: Date.now()
    };

    if (task.period === 'daily') {
      data.taskRecords[today] = records;
      // 打卡
      onCheckIn();
    } else if (task.period === 'weekly') {
      data.weeklyRecords[recordKey] = records;
    } else {
      data.monthlyRecords[recordKey] = records;
    }

    saveData();
  } else if (newProgress < oldProgress) {
    // 进度减少（不扣分）
    records[taskId] = {
      progress: newProgress,
      points: existing ? existing.points : 0,
      time: Date.now()
    };
    if (task.period === 'daily') data.taskRecords[today] = records;
    else if (task.period === 'weekly') data.weeklyRecords[recordKey] = records;
    else data.monthlyRecords[recordKey] = records;
    saveData();
  }

  // 检查特殊日期额外奖励
  var holidayToday = getTodayStr();
  if (isBirthday(holidayToday) || getHolidayName(holidayToday)) {
    // 检查是否全部清空
    var dailyTasks = data.tasks.filter(function(t) { return t.period === 'daily'; });
    var todayRecs = data.taskRecords[holidayToday] || {};
    if (dailyTasks.length > 0 && dailyTasks.every(function(t) {
      return todayRecs[t.id] && todayRecs[t.id].progress >= 100;
    })) {
      // 全部完成，给2次抽奖
      data.lotteryChances += 2;
      saveData();
      showToast('🎉 节日全清任务！+2次抽奖机会');
    }
    if (isBirthday(holidayToday)) {
      // 生日额外3次抽奖（每天只给一次）
      if (!data._birthdayLotteryGiven || data._birthdayLotteryGiven !== holidayToday) {
        data.lotteryChances += 3;
        data._birthdayLotteryGiven = holidayToday;
        saveData();
        showToast('🎂 生日快乐！+3次抽奖机会');
      }
    }
  }
}

/* ===== 抽奖系统 ===== */
function doLottery() {
  if (data.lotteryChances <= 0) {
    showToast('没有抽奖机会了');
    return;
  }
  data.lotteryChances--;
  // 随机 10~100 积分
  var points = Math.floor(Math.random() * 91) + 10;
  data.availablePoints += points;
  data.totalXP += points;
  var today = getTodayStr();
  data.pointsHistory[today] = (data.pointsHistory[today] || 0) + points;
  saveData();

  // 首次抽奖徽章
  if (!data.badges.find(function(b) { return b.id === 'first_lottery'; })) {
    unlockBadge('first_lottery', '初次抽奖', '<img src="./assets/icons/shell.png" class="badge-icon-img" alt="badge">');
  }

  checkLevelUp();
  checkAutoBadges();
  return points;
}

/* ===== 奖励兑换 ===== */
function exchangeReward(rewardId) {
  var reward = data.rewards.find(function(r) { return r.id === rewardId; });
  if (!reward) return;
  if (data.availablePoints < reward.cost) {
    showToast('积分不足');
    return;
  }
  data.availablePoints -= reward.cost;
  data.exchangeRecords.unshift({
    name: reward.name,
    cost: reward.cost,
    icon: reward.icon,
    time: getTodayStr() + ' ' + new Date().toTimeString().slice(0, 5)
  });
  // 只保留最近20条
  if (data.exchangeRecords.length > 20) data.exchangeRecords.length = 20;
  saveData();

  // 首次兑换徽章
  if (!data.badges.find(function(b) { return b.id === 'first_reward'; })) {
    unlockBadge('first_reward', '首次兑换', '<img src="./assets/icons/shell.png" class="badge-icon-img" alt="badge">');
  }
  showToast('🎉 兑换成功：' + reward.name);
}

function renderPointsChart() {
  var canvas = document.getElementById('chart-points');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  // 获取近7天数据
  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date();
    d.setDate(d.getDate() - i);
    days.push(formatDate(d));
  }

  var values = days.map(function(d) { return data.pointsHistory[d] || 0; });
  var maxVal = Math.max.apply(null, values.concat([10]));

  // 画图
  var w = canvas.offsetWidth;
  var h = 160;
  canvas.width = w * 2;
  canvas.height = h * 2;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(2, 2);

  ctx.clearRect(0, 0, w, h);

  // 网格线
  ctx.strokeStyle = '#eaf5ed';
  ctx.lineWidth = 1;
  for (var g = 0; g < 4; g++) {
    var y = (h - 30) * (g / 3) + 10;
    ctx.beginPath();
    ctx.moveTo(30, y);
    ctx.lineTo(w - 10, y);
    ctx.stroke();
  }

  // 折线
  var padding = 30;
  var chartW = w - padding - 10;
  var chartH = h - 40;

  ctx.strokeStyle = '#2d5a3d';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  values.forEach(function(v, i) {
    var x = padding + (chartW / 6) * i;
    var y = chartH - (v / maxVal) * (chartH - 20) + 10;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 填充
  ctx.lineTo(padding + chartW, chartH + 10);
  ctx.lineTo(padding, chartH + 10);
  ctx.closePath();
  ctx.fillStyle = 'rgba(45, 90, 61, 0.08)';
  ctx.fill();

  // 数据点
  values.forEach(function(v, i) {
    var x = padding + (chartW / 6) * i;
    var y = chartH - (v / maxVal) * (chartH - 20) + 10;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#2d5a3d';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // 日期标签
  ctx.fillStyle = '#8a9a90';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  days.forEach(function(d, i) {
    var x = padding + (chartW / 6) * i;
    var label = d.slice(5);
    ctx.fillText(label, x, h - 5);
  });
}

  canvas.height = h * 2;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(2, 2);
  ctx.clearRect(0, 0, w, h);

  if (total === 0) {
    ctx.fillStyle = '#8a9a90';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据', w / 2, h / 2);
    document.getElementById('category-legend').innerHTML = '';
    return;
  }

  // 画饼图
  var cx = w / 2;
  var cy = h / 2;
  var radius = Math.min(w, h) / 2 - 20;
  var startAngle = -Math.PI / 2;

  var colors = ['#2d5a3d', '#52b788', '#e9b44c', '#4a8eb5', '#e07a5f', '#b7e4c7'];

  cats.forEach(function(cat, i) {
    var angle = (values[i] / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, startAngle + angle);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    startAngle += angle;
  });

  // 中心空白
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  // 中心文字
  ctx.fillStyle = '#2d5a3d';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('今日', cx, cy - 6);
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#8a9a90';
  ctx.fillText('分类分布', cx, cy + 10);

  // 图例
  var legendHtml = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">' +
    cats.map(function(cat, i) {
      return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);">' +
        '<span style="width:10px;height:10px;border-radius:3px;background:' + colors[i % colors.length] + ';"></span>' +
        escapeHtml(cat) + ' ' + Math.round((values[i] / total) * 100) + '%' +
      '</span>';
    }).join('') +
    '</div>';
  document.getElementById('category-legend').innerHTML = legendHtml;
}

function renderBadgeGrid() {
  var gridEl = document.getElementById('badge-grid');

  // 合并预定义和已解锁
  var allBadges = BADGE_DEFS.map(function(def) {
    var unlocked = data.badges.find(function(b) { return b.id === def.id; });
    return {
      id: def.id,
      name: def.name,
      icon: def.icon,
      desc: def.desc,
      unlocked: !!unlocked,
      count: unlocked ? unlocked.count : 0
    };
  });

  // 加上自定义解锁的徽章（如连续打卡30天的累加徽章）
  data.badges.forEach(function(b) {
    if (!allBadges.find(function(ab) { return ab.id === b.id; })) {
      allBadges.push({
        id: b.id,
        name: b.name,
        icon: b.icon,
        desc: '',
        unlocked: true,
        count: b.count
      });
    }
  });

  if (allBadges.length === 0) {
    gridEl.innerHTML = '<div class="empty-state"><div class="empty-text">暂无徽章</div></div>';
    return;
  }

  gridEl.innerHTML = allBadges.map(function(b) {
    var cls = 'badge-item ' + (b.unlocked ? 'unlocked' : 'locked');
    var countBadge = b.count > 1 ? '<div class="badge-count">×' + b.count + '</div>' : '';
    return '<div class="' + cls + '">' +
      '<div class="badge-icon">' + b.icon + '</div>' +
      '<div class="badge-name">' + escapeHtml(b.name) + '</div>' +
      countBadge +
    '</div>';
  }).join('');
}

/* ===== UI 辅助函数 ===== */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2200);
}

function showFloatPoints(text) {
  var el = document.createElement('div');
  el.className = 'float-points';
  el.textContent = text;
  el.style.left = (window.innerWidth / 2 - 30) + 'px';
  el.style.top = '120px';
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 1200);
}

function showLevelUp(level, rewardText) {
  var overlay = document.getElementById('levelup-overlay');
  document.getElementById('levelup-title').textContent = 'Lv.' + level;
  document.getElementById('levelup-subtitle').textContent = level % 10 === 0 ? '里程碑达成！' : '恭喜升级！';
  document.getElementById('levelup-reward').innerHTML = '<div class="levelup-reward-text">' + rewardText + '</div>';
  overlay.classList.add('show');
}

function showBadgeUnlock(icon, name) {
  var overlay = document.getElementById('badge-unlock-overlay');
  document.getElementById('badge-unlock-icon').innerHTML = icon;
  document.getElementById('badge-unlock-name').textContent = name;
  // 延迟显示，避免和升级弹窗冲突
  setTimeout(function() {
    overlay.classList.add('show');
  }, 100);
}

function showConfirm(text, onConfirm) {
  var overlay = document.getElementById('confirm-overlay');
  document.getElementById('confirm-text').textContent = text;
  overlay.classList.add('show');

  var yesBtn = document.getElementById('confirm-yes-btn');
  var noBtn = document.getElementById('confirm-no-btn');

  var yesHandler = function() {
    overlay.classList.remove('show');
    yesBtn.removeEventListener('click', yesHandler);
    noBtn.removeEventListener('click', noHandler);
    onConfirm();
  };
  var noHandler = function() {
    overlay.classList.remove('show');
    yesBtn.removeEventListener('click', yesHandler);
    noBtn.removeEventListener('click', noHandler);
  };

  yesBtn.addEventListener('click', yesHandler);
  noBtn.addEventListener('click', noHandler);
}

/* ===== 事件绑定 ===== */
function bindEvents() {
  // 底部导航
  document.querySelectorAll('.nav-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var page = this.dataset.page;
      switchPage(page);
    });
  });

  // Tab 切换
  document.querySelectorAll('.tab-switch button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-switch button').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentPeriod = this.dataset.period;
      renderTaskList();
    });
  });

  // 添加任务
  document.getElementById('add-task-btn').addEventListener('click', function() {
    editingTaskId = null;
    selectedTag = '学习';
    document.getElementById('task-modal-title').textContent = '添加任务';
    document.getElementById('task-name-input').value = '';
    document.getElementById('task-points-input').value = '';
    document.getElementById('task-period-select').value = currentPeriod;
    document.querySelectorAll('#tag-options .tag-option').forEach(function(b) { b.classList.remove('active'); });
    document.querySelector('#tag-options .tag-option[data-tag="学习"]').classList.add('active');
    showModal('task-modal');
  });

  // 标签选择
  document.querySelectorAll('#tag-options .tag-option').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#tag-options .tag-option').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      selectedTag = this.dataset.tag;
    });
  });

  // 保存任务
  document.getElementById('task-save-btn').addEventListener('click', function() {
    var name = document.getElementById('task-name-input').value.trim();
    var points = parseInt(document.getElementById('task-points-input').value);
    var period = document.getElementById('task-period-select').value;

    if (!name) { showToast('请输入任务名称'); return; }
    if (!points || points < 1) { showToast('请输入有效积分值'); return; }

    if (editingTaskId) {
      var task = data.tasks.find(function(t) { return t.id === editingTaskId; });
      if (task) {
        task.name = name;
        task.points = points;
        task.period = period;
        task.tag = selectedTag;
      }
    } else {
      var newTask = {
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: name,
        points: points,
        period: period,
        tag: selectedTag,
        createdAt: Date.now()
      };
      data.tasks.push(newTask);
    }
    saveData();
    hideModal('task-modal');
    render();
  });

  // 取消任务
  document.getElementById('task-cancel-btn').addEventListener('click', function() {
    hideModal('task-modal');
  });

  // 任务列表点击（完成/进度选择）
  document.getElementById('task-list').addEventListener('click', function(e) {
    // 检查是否点击了编辑/删除按钮
    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      var action = actionBtn.dataset.action;
      var taskId = actionBtn.dataset.taskId;
      if (action === 'edit') {
        editTask(taskId);
      } else if (action === 'delete') {
        deleteTask(taskId);
      }
      return;
    }

    var taskItem = e.target.closest('.task-item');
    if (!taskItem) return;
    var taskId = taskItem.dataset.taskId;
    var task = data.tasks.find(function(t) { return t.id === taskId; });
    if (!task) return;

    // 获取当前进度
    var records;
    if (task.period === 'daily') records = data.taskRecords[getTodayStr()] || {};
    else if (task.period === 'weekly') records = data.weeklyRecords[getWeekKey()] || {};
    else records = data.monthlyRecords[getMonthKey()] || {};

    var currentProgress = records[taskId] ? records[taskId].progress : 0;

    if (currentProgress >= 100) return; // 已完成

    // 显示进度选择弹窗
    document.getElementById('progress-task-name').textContent = task.name + ' (' + task.points + '分)';
    document.querySelectorAll('.progress-option').forEach(function(b) { b.classList.remove('active'); });
    updateProgressPreview(task.points, 0);
    document.getElementById('progress-modal').dataset.taskId = taskId;
    showModal('progress-modal');
  });

  // 进度选择
  document.querySelectorAll('.progress-option').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.progress-option').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      var progress = parseInt(this.dataset.progress);
      var modal = document.getElementById('progress-modal');
      var taskId = modal.dataset.taskId;
      var task = data.tasks.find(function(t) { return t.id === taskId; });
      if (task) {
        updateProgressPreview(task.points, progress);
      }
    });
  });

  // 进度确认 - 点击弹窗外区域或取消
  document.getElementById('progress-cancel-btn').addEventListener('click', function() {
    hideModal('progress-modal');
  });

  // 双击进度选项直接确认
  document.querySelectorAll('.progress-option').forEach(function(btn) {
    btn.addEventListener('dblclick', function() {
      confirmProgress();
    });
  });

  // 添加进度确认按钮
  var progressConfirmBtn = document.createElement('button');
  progressConfirmBtn.className = 'btn btn-primary btn-block';
  progressConfirmBtn.style.marginTop = '12px';
  progressConfirmBtn.textContent = '确认';
  progressConfirmBtn.addEventListener('click', confirmProgress);
  document.querySelector('#progress-modal .modal').insertBefore(
    progressConfirmBtn,
    document.getElementById('progress-cancel-btn')
  );

  function confirmProgress() {
    var modal = document.getElementById('progress-modal');
    var taskId = modal.dataset.taskId;
    var activeBtn = document.querySelector('.progress-option.active');
    if (!activeBtn) { showToast('请选择完成进度'); return; }
    var progress = parseInt(activeBtn.dataset.progress);
    completeTask(taskId, progress);
    hideModal('progress-modal');
    render();
  }

  // 添加奖励
  document.getElementById('add-reward-btn').addEventListener('click', function() {
    editingRewardId = null;
    selectedIcon = '🧋';
    document.getElementById('reward-modal-title').textContent = '添加奖励';
    document.getElementById('reward-name-input').value = '';
    document.getElementById('reward-cost-input').value = '';
    document.querySelectorAll('#reward-icon-options .tag-option').forEach(function(b) { b.classList.remove('active'); });
    document.querySelector('#reward-icon-options .tag-option[data-icon="🧋"]').classList.add('active');
    showModal('reward-modal');
  });

  // 奖励图标选择
  document.querySelectorAll('#reward-icon-options .tag-option').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#reward-icon-options .tag-option').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      selectedIcon = this.dataset.icon;
    });
  });

  // 保存奖励
  document.getElementById('reward-save-btn').addEventListener('click', function() {
    var name = document.getElementById('reward-name-input').value.trim();
    var cost = parseInt(document.getElementById('reward-cost-input').value);

    if (!name) { showToast('请输入奖励名称'); return; }
    if (!cost || cost < 1) { showToast('请输入有效积分数'); return; }

    if (editingRewardId) {
      var reward = data.rewards.find(function(r) { return r.id === editingRewardId; });
      if (reward) {
        reward.name = name;
        reward.cost = cost;
        reward.icon = selectedIcon;
      }
    } else {
      data.rewards.push({
        id: 'reward_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: name,
        cost: cost,
        icon: selectedIcon
      });
    }
    saveData();
    hideModal('reward-modal');
    render();
  });

  // 取消奖励
  document.getElementById('reward-cancel-btn').addEventListener('click', function() {
    hideModal('reward-modal');
  });

  // 兑换/编辑/删除奖励（事件委托）
  document.getElementById('reward-list').addEventListener('click', function(e) {
    var exchangeBtn = e.target.closest('.exchange-btn');
    var editBtn = e.target.closest('.edit-reward-btn');
    var deleteBtn = e.target.closest('.delete-reward-btn');

    if (exchangeBtn) {
      var rewardId = exchangeBtn.dataset.rewardId;
      var reward = data.rewards.find(function(r) { return r.id === rewardId; });
      if (reward) {
        showConfirm('确认兑换「' + reward.name + '」？消耗 ' + reward.cost + ' 积分', function() {
          exchangeReward(rewardId);
          render();
        });
      }
    } else if (editBtn) {
      editReward(editBtn.dataset.rewardId);
    } else if (deleteBtn) {
      var rid = deleteBtn.dataset.rewardId;
      showConfirm('确认删除此奖励？', function() {
        data.rewards = data.rewards.filter(function(r) { return r.id !== rid; });
        saveData();
        render();
      });
    }
  });

  // 抽奖
  document.getElementById('lottery-btn').addEventListener('click', function() {
    var btn = this;
    var resultEl = document.getElementById('lottery-result');
    btn.disabled = true;
    btn.classList.add('spinning');
    resultEl.textContent = '';

    setTimeout(function() {
      var points = doLottery();
      btn.classList.remove('spinning');
      resultEl.textContent = '+' + points + ' 分！';
      btn.disabled = data.lotteryChances <= 0;
      render();
    }, 800);
  });

  // 使用双倍卡
  document.getElementById('inventory-grid').addEventListener('click', function(e) {
    var useBtn = e.target.closest('.use-double-card-btn');
    if (useBtn) {
      if (data.doubleCards > 0) {
        data.doubleCards--;
        data.doubleCardActive = Date.now();
        saveData();
        showToast('⚡ 双倍积分卡已激活！24小时有效');
        render();
      }
    }
  });

  // 升级弹窗跳过
  document.getElementById('levelup-skip-btn').addEventListener('click', function() {
    document.getElementById('levelup-overlay').classList.remove('show');
  });

  // 徽章弹窗关闭
  document.getElementById('badge-unlock-close-btn').addEventListener('click', function() {
    document.getElementById('badge-unlock-overlay').classList.remove('show');
  });

  // 长按任务显示操作按钮
  var pressTimer = null;
  document.getElementById('task-list').addEventListener('touchstart', function(e) {
    var taskItem = e.target.closest('.task-item');
    if (!taskItem) return;
    pressTimer = setTimeout(function() {
      taskItem.classList.add('show-actions');
      // 3秒后自动隐藏
      setTimeout(function() {
        taskItem.classList.remove('show-actions');
      }, 3000);
    }, 500);
  });

  document.getElementById('task-list').addEventListener('touchend', function() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  });

  document.getElementById('task-list').addEventListener('touchmove', function() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  });
}

function updateProgressPreview(taskPoints, progress) {
  var multiplier = getTotalMultiplier();
  var actualPoints = Math.round(taskPoints * progress / 100 * multiplier);
  var el = document.getElementById('progress-points-preview');
  if (progress > 0) {
    el.textContent = '可得 ' + actualPoints + ' 分' + (multiplier > 1 ? ' (含倍率×' + multiplier.toFixed(1) + ')' : '');
  } else {
    el.textContent = '可得 0 分';
  }
}

function editTask(taskId) {
  var task = data.tasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  editingTaskId = taskId;
  selectedTag = task.tag;
  document.getElementById('task-modal-title').textContent = '编辑任务';
  document.getElementById('task-name-input').value = task.name;
  document.getElementById('task-points-input').value = task.points;
  document.getElementById('task-period-select').value = task.period;
  document.querySelectorAll('#tag-options .tag-option').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tag === task.tag);
  });
  showModal('task-modal');
}

function deleteTask(taskId) {
  showConfirm('确认删除此任务？', function() {
    data.tasks = data.tasks.filter(function(t) { return t.id !== taskId; });
    saveData();
    render();
  });
}

function editReward(rewardId) {
  var reward = data.rewards.find(function(r) { return r.id === rewardId; });
  if (!reward) return;
  editingRewardId = rewardId;
  selectedIcon = reward.icon;
  document.getElementById('reward-modal-title').textContent = '编辑奖励';
  document.getElementById('reward-name-input').value = reward.name;
  document.getElementById('reward-cost-input').value = reward.cost;
  document.querySelectorAll('#reward-icon-options .tag-option').forEach(function(b) {
    b.classList.toggle('active', b.dataset.icon === reward.icon);
  });
  showModal('reward-modal');
}

function switchPage(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector('.nav-item[data-page="' + page + '"]').classList.add('active');

  if (page === 'stats') {
    // 延迟渲染图表，等待页面可见
    setTimeout(function() {
      renderStatsPage();
    }, 100);
  } else if (page === 'rewards') {
    renderRewardsPage();
  }
}

function showModal(id) {
  document.getElementById(id).classList.add('show');
}

function hideModal(id) {
  document.getElementById(id).classList.remove('show');
}

/* ===== 初始化 ===== */
function init() {
  // 检查断签
  checkStreak();

  // 生成每日挑战
  generateDailyChallenge();

  // 检查每日挑战是否完成
  checkDailyChallenge();

  // 检查自动徽章
  checkAutoBadges();

  // 绑定事件
  bindEvents();

  // 渲染
  render();

  // 注册 Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  }
}

// 启动
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
